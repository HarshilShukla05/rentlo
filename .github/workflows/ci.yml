name: ci

on:
  pull_request:
  push:
    branches: [main, claude/gallant-darwin-gxloil]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run synthetic conversation and unit tests
        shell: bash
        run: cargo test --workspace --locked | tee "$RUNNER_TEMP/rentlo-rust-tests.log"
        env:
          RENTLO_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      - name: Summarize test evidence
        if: always()
        run: |
          log="$RUNNER_TEMP/rentlo-rust-tests.log"
          if [[ -f "$log" ]]; then
            printf '### Synthetic conversation test evidence\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'shared_locations|reads_wrapped_current|maps::tests|two_people_meet|delete_erases_everything|test result:' "$log" >> "$GITHUB_STEP_SUMMARY" || true
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
