[package]
name = "rentlo"
description = "The Rentlo server: `rentlo bot` (WhatsApp) and `rentlo api` (the web)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
app.workspace = true
domain.workspace = true
store.workspace = true
wa.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
